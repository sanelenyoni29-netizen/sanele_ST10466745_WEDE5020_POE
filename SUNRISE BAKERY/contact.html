</head>
<body>

    <header>
        <div class="container">
            <div class="logo"><a href="index.html">☀️ Sunrise Bakery</a></div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>

            <div class="hamburger" id="hamburger">
                <span></span><span></span><span></span>

    <section class="page-header">
        <div class="container">
            <h1>Get in Touch</h1>
            <p>We'd love to hear from you — drop us a message!</p>
        </div>
    </section>

    <section class="contact-form-section">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-form-container">
                    <h2>Send Us a Message</h2>
                    <form id="contact-form" action="#" method="POST">
                        <div class="form-group">
                            <label for="contact-name">Full Name *</label>
                            <input type="text" id="contact-name" name="name" placeholder="Enter your full name" required>
                        </div>

                        <div class="form-group">
                            <label for="contact-email">Email Address *</label>
                            <input type="email" id="contact-email" name="email" placeholder="Enter your email address" required>
                        </div>

                        <div class="form-group">
                            <label for="contact-subject">Subject</label>
                            <input type="text" id="contact-subject" name="subject" placeholder="What's this about?">
                        </div>

                        <div class="form-group">
                            <label for="contact-message">Message *</label>
                            <textarea id="contact-message" name="message" rows="5" placeholder="Tell us how we can help..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">Send Message</button>
                        <p id="contact-message-status" class="form-message"></p>
                    </form>
                </div>
